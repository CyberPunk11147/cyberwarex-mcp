name: Publish Agent Council to MCP Registry

# The Agent Council MCP server, published from THIS org under the namespace this org's OIDC owns
# (io.github.cyberwareX/*). The sibling publish-mcp.yml handles the five servers that live in the
# io.github.CyberPunk11147/* namespace and only runs for that owner; this one is its mirror image, so
# neither workflow ever tries to publish a name it cannot prove ownership of (that combination is
# what produced 403s and failure emails on 2026-09-10).
#
# REGISTRY LIMIT (hit 2026-09-29): server.json `description` must be <= 100 characters. A longer one
# fails ONLY at the final publish step with a 422 after the image is already built and pushed.
#
# Trigger: push a council tag, e.g.  git tag council-v1.1.0 && git push cwx council-v1.1.0

on:
  push:
    tags: ["council-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.1.0)"
        required: true
        default: "1.1.0"

jobs:
  publish:
    if: github.repository_owner == 'cyberwareX'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC for mcp-publisher (proves the io.github.<owner> namespace)
      contents: read
      packages: write   # push the image to ghcr.io with GITHUB_TOKEN
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Derive version + lowercase owner
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/council-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/council-v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "owner_lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image (marker as MANIFEST annotation, not just a config label)
        uses: docker/build-push-action@v6
        with:
          context: ./council
          push: true
          provenance: false   # single image manifest, so the annotation lands where the registry reads it
          sbom: false
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/cyberwarex-council:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/cyberwarex-council:latest
          annotations: |
            io.modelcontextprotocol.server.name=io.github.cyberwareX/cyberwarex-council

      - name: Pin version + image tag into server.json
        run: |
          cd council
          V="${{ steps.meta.outputs.version }}"
          jq --arg v "$V" '.version=$v | .packages[0].identifier = (.packages[0].identifier | sub(":[^:/]+$"; ":"+$v))' server.json > s.tmp && mv s.tmp server.json
          cat server.json

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: |
          cd council
          ../mcp-publisher publish
